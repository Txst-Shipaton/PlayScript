<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradientS29" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2C3E4C"/>
      <stop offset="100%" stop-color="#5A6C7D"/>
    </linearGradient>
    <filter id="villainShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .stroked {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }
    #running_duo {
      animation: scenePan 1s linear infinite;
    }
    #sherlock_holmes_running .arm, #villain_running .arm {
      animation: runArms 0.4s linear infinite;
    }
    #sherlock_holmes_running .leg, #villain_running .leg {
      animation: runLegs 0.4s linear infinite;
    }
    #sherlock_holmes_running .arm.right, #villain_running .arm.right {
      animation-delay: -0.2s;
    }
    #sherlock_holmes_running .leg.right, #villain_running .leg.right {
      animation-delay: -0.2s;
    }

    @keyframes scenePan {
      from { transform: translateX(0px); }
      to { transform: translateX(50px); }
    }
    @keyframes runArms {
      0% { transform: rotate(25deg); }
      50% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }
    @keyframes runLegs {
      0% { transform: rotate(-30deg); }
      50% { transform: rotate(30deg); }
      100% { transform: rotate(-30deg); }
    }
  </style>

  <rect width="1280" height="720" fill="url(#bgGradientS29)"/>

  <g id="bg_building_facade">
    <path class="stroked" fill="#2A3A4B" d="M -50,550 L 1330,550 L 1330,720 L -50,720 Z M 100,550 L 100,450 L 200,450 L 200,550 M 300,550 L 300,400 L 400,400 L 400,550 M 900,550 L 900,420 L 980,420 L 980,550 M 1100,550 L 1100,480 L 1150,480 L 1150,550" />
    <path class="stroked" fill="#5C6C7D" d="M 500 550 L 500 200 L 550 200 L 550 150 L 600 150 L 600 200 L 780 200 L 780 150 L 830 150 L 830 200 L 880 200 L 880 550 Z M 640 550 L 640 300 A 50 50 0 0 1 740 300 L 740 550 Z" />
  </g>

  <g id="running_duo">
    <!-- Layer order: villain is behind Sherlock -->
    <g id="character_villain_running" transform="translate(450, 400)" filter="url(#villainShadow)">
      <!-- Moriarty -->
      <g class="leg left" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#FF0000" d="M -10,90 L 0,180 L 20,180 L 10,90 Z"/>
        <path class="stroked" fill="#1A1A1A" d="M -5,180 L 25,180 L 30,190 L -10,190 Z"/>
      </g>
      <g class="leg right" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#FF0000" d="M 10,90 L 20,180 L 40,180 L 30,90 Z"/>
        <path class="stroked" fill="#1A1A1A" d="M 15,180 L 45,180 L 50,190 L 10,190 Z"/>
      </g>
      <path class="stroked" fill="#8B0000" d="M -20,0 L 40,0 L 50,100 L -30,100 Z"/>
      <path class="stroked" fill="#1A1A1A" d="M -20,0 L -10,0 L -10,40 L 0,20 L 20,20 L 30,40 L 30,0 L 40,0 L 30,20 L 0,20 Z" />
      <g class="arm left" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#8B0000" d="M -35,10 L -25,10 L -15,90 L -25,90 Z"/>
      </g>
      <g class="arm right" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#8B0000" d="M 45,10 L 55,10 L 65,90 L 55,90 Z"/>
      </g>
      <g id="villain_head">
        <path class="stroked" fill="#E0B996" d="M -10,-60 C -10,-90 30,-90 30,-60 C 30,-30 -10,-30 -10,-60 Z"/>
        <path class="stroked" fill="#1A1A1A" d="M -20,-65 L 40,-65 L 40,-110 L -20,-110 Z M -5,-65 L 25,-65 L 25,-80 L -5,-80 Z"/>
      </g>
    </g>

    <g id="character_sherlock_holmes_running" transform="translate(650, 410)">
      <!-- Sherlock Holmes -->
      <g class="leg left" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#C0C0C0" d="M -15,95 L -5,185 L 15,185 L 5,95 Z"/>
        <path class="stroked" fill="#4A2E1D" d="M -10,185 L 20,185 L 25,195 L -15,195 Z"/>
      </g>
      <g class="leg right" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#C0C0C0" d="M 15,95 L 25,185 L 45,185 L 35,95 Z"/>
        <path class="stroked" fill="#4A2E1D" d="M 20,185 L 50,185 L 55,195 L 15,195 Z"/>
      </g>
      <path class="stroked" fill="#8B4513" d="M -25,0 L 45,0 L 55,100 L -35,100 Z"/>
      <g class="arm left" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#8B4513" d="M -40,15 L -30,15 L -20,95 L -30,95 Z"/>
      </g>
      <g id="sherlock_head" style="transform-origin: 50% 90%;">
        <path class="stroked" fill="#E0B996" d="M -5,-60 C -5,-85 35,-85 35,-60 C 35,-35 -5,-35 -5,-60 Z"/>
        <path class="stroked" fill="#4A2E1D" d="M -5,-70 C 15,-90 35,-70 35,-70 C 25,-60 5,-60 -5,-70 Z"/>
      </g>
      <g class="arm right" style="transform-origin: 50% 10%;">
        <path class="stroked" fill="#8B4513" d="M 50,15 L 60,15 L 70,95 L 60,95 Z"/>
      </g>
    </g>
  </g>
</svg>
