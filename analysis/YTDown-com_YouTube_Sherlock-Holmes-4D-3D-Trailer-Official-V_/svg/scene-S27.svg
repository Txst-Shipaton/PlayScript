<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg_gradient_S27" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D4A76B" />
      <stop offset="100%" stop-color="#1A2B3D" />
    </radialGradient>
    <filter id="shadow_holmes_face" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <clipPath id="lens-clip">
      <circle cx="640" cy="360" r="160" />
    </clipPath>
  </defs>
  <style>
    @keyframes wobble {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-5px, 5px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes headBob {
      0% { transform: rotateY(0deg) translateY(0); }
      50% { transform: rotateY(-15deg) translateY(-5px); }
      100% { transform: rotateY(0deg) translateY(0); }
    }
    .scene-background {
      width: 100%;
      height: 100%;
      fill: url(#bg_gradient_S27);
    }
    #sherlock_holmes_face {
      animation: headBob 1s linear infinite;
      transform-origin: 640px 360px;
      filter: url(#shadow_holmes_face);
    }
    #magnifying_glass_assembly {
      animation: wobble 1s cubic-bezier(0.47, 0, 0.745, 0.715) infinite;
    }
    .stroked {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <rect class="scene-background" width="1280" height="720" />

  <g id="sherlock_holmes_face">
    <!-- Skin -->
    <path class="stroked" fill="#E0B996" d="M 450,150 Q 500,550 850,550 Q 800,150 450,150 Z" />
    <!-- Hair -->
    <path class="stroked" fill="#4A2E1D" d="M 450,150 C 480,120 750,120 800,150 L 780,220 C 700,180 550,180 470,220 Z" />
    <!-- Eyebrow -->
    <path class="stroked" fill="#4A2E1D" d="M 540,280 Q 640,260 740,285" />
    <!-- Eye -->
    <g transform="translate(640, 360)">
      <path class="stroked" fill="#FFFFFF" d="M -100,0 C -100,-40 100,-40 100,0 C 100,40 -100,40 -100,0 Z" />
      <circle class="stroked" fill="#5F8B5A" cx="0" cy="0" r="35" />
      <circle fill="#000000" cx="0" cy="0" r="18" />
    </g>
    <!-- Nose -->
    <path class="stroked" fill="none" d="M 750,300 L 770,420 C 770,420 750,450 730,440" />
  </g>

  <g id="magnifying_glass_assembly">
    <g clip-path="url(#lens-clip)">
      <use href="#sherlock_holmes_face" transform="translate(640, 360) scale(1.2) translate(-640, -360)" />
      <circle cx="640" cy="360" r="160" fill="rgba(200, 220, 255, 0.1)" />
    </g>
    <g class="stroked">
      <circle fill="none" stroke="#C0C0C0" stroke-width="25" cx="640" cy="360" r="160" />
      <path fill="#8B4513" d="M 775,495 l 20,20 a 10,10 0 0 1 0,14 l -20,20 l 150,150 l 30,-30 l -150,-150 l 20,-20 a 10,10 0 0 1 14,0 l 20,20 z" />
    </g>
  </g>

</svg>
