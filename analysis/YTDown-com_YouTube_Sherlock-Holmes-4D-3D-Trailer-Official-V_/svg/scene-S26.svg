<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg_gradient_S26" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2C3E4C"/>
      <stop offset="100%" stop-color="#1A2B3D"/>
    </linearGradient>
    <filter id="shadow_holmes" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="lamp_glow">
      <stop offset="0%" stop-color="#D4A76B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4A76B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    path, rect, circle, polygon, text {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #camera_S26 {
      animation: camera_pan_S26 1s linear infinite;
    }
    #sherlock_holmes_S26 {
      animation: sherlock_inspect_S26 1s ease-in-out infinite;
      transform-origin: 50% 95%;
    }
    @keyframes camera_pan_S26 {
      from { transform: translateX(0px); }
      to { transform: translateX(-100px); }
    }
    @keyframes sherlock_inspect_S26 {
      0% { transform: rotateY(0deg) translateY(0px); }
      50% { transform: rotateY(-10deg) translateY(-10px); }
      100% { transform: rotateY(-10deg) translateY(-10px); }
    }
  </style>
  <rect width="1280" height="720" fill="url(#bg_gradient_S26)"/>
  <g id="camera_S26">
    <!-- Layer 1: bg_foggy_city_skyline_nelson_column -->
    <g id="bg_foggy_city_skyline_nelson_column" fill="#2A3A4B" stroke="none" opacity="0.5">
      <path d="M-50,550 h1500 v-50 l-50,-20 l-30,10 l-40,-30 l-30,15 l-60,-40 l-20,10 l-80,-60 l-30,20 l-50,-30 l-10,-40 l-15,10 l-10,-50 l-15,20 l-50,-30 l-80,20 l-100,-50 l-40,20 l-70,-40 l-30,10 l-90,-60 l-40,10 l-60,-30 l-80,20 l-50,-20 z"/>
      <rect x="300" y="380" width="20" height="120"/>
      <polygon points="310,380 300,370 320,370"/>
      <rect x="305" y="320" width="10" height="60"/>
    </g>
    <!-- Layer 2: bg_lampposts -->
    <g id="bg_lampposts">
      <rect x="150" y="280" width="12" height="440" fill="#3A4A5B"/>
      <path d="M156,280 h20 l10,-15 h-40 l10,15 z" fill="#3A4A5B"/>
      <circle cx="166" cy="265" r="30" fill="url(#lamp_glow)" stroke="none"/>
      <circle cx="166" cy="265" r="12" fill="#D4A76B" stroke="#202020"/>
    </g>
    <!-- Layer 3: flower_stand_with_closed_sign -->
    <g id="flower_stand_with_closed_sign" transform="translate(600, 350)">
      <rect x="0" y="0" width="400" height="300" fill="#2E8B57"/>
      <rect x="10" y="10" width="380" height="280" fill="#20573A"/>
      <rect x="20" y="20" width="170" height="260" fill="#8B0000"/>
      <rect x="210" y="20" width="170" height="260" fill="#8B0000"/>
      <path d="M0,0 L-20, -20 H420 L400,0 z" fill="#5C3A2E"/>
      <g transform="translate(150, 80)">
        <rect x="0" y="0" width="100" height="50" fill="#DCDCDC"/>
        <text x="50" y="32" font-family="sans-serif" font-weight="700" font-size="21.6" fill="#FFFFFF" text-anchor="middle" stroke="none">CLOSED</text>
      </g>
    </g>
    <!-- Layer 4 & 5: character_sherlock_holmes_at_stand & magnifying_glass_lens -->
    <g id="sherlock_holmes_S26" transform="translate(450, 300)" filter="url(#shadow_holmes)">
      <g id="sherlock_torso">
        <!-- Overcoat -->
        <path d="M-40,120 L-60,380 H60 L40,120 L20,115 L20,200 L-20,200 L-20,115 Z" fill="#8B4513"/>
        <!-- Waistcoat -->
        <polygon points="-20,120 20,120 15,200 -15,200" fill="#3B5B52"/>
        <!-- Shirt/Cravat -->
        <polygon points="-5,120 5,120 5,135 -5,135" fill="#FFFFFF"/>
        <polygon points="-8,130 8,130 0,145" fill="#1A1A1A"/>
      </g>
      <g id="sherlock_arm_right" transform="translate(40, 140)">
        <path d="M0,0 l20,-5 l60,60 l-20,10 z" fill="#6B3E26"/>
        <g id="sherlock_hand_right" transform="translate(60, 65)">
          <!-- Magnifying Glass Handle -->
          <rect x="-5" y="0" width="10" height="40" fill="#8B4513"/>
          <!-- Magnifying Glass Rim -->
          <circle cx="0" cy="-30" r="30" fill="none" stroke="#C0C0C0" stroke-width="4"/>
          <!-- Hand -->
          <path d="M-10,5 a 15 15 0 1 1 20 0 v 20 h -20 z" fill="#E0B996"/>
        </g>
      </g>
      <g id="sherlock_head" transform="translate(0, 50)">
        <!-- Head Shape -->
        <path d="M0,0 C-35,0 -45,50 -30,90 C-15,130 15,130 30,90 C45,50 35,0 0,0 Z" fill="#E0B996"/>
        <!-- Hair -->
        <path d="M-35,25 C-40,5 -20,-5 0,-5 C20,-5 40,5 35,25 L30,20 C20,10 -20,10 -30,20 Z" fill="#4A2E1D"/>
        <!-- Deerstalker Hat -->
        <path d="M0,-35 a 40 15 0 0 1 0 30 a 40 15 0 0 1 0 -30" fill="#8B4513"/>
        <path d="M-40,-20 l-15,-5 l5,15 z M40,-20 l15,-5 l-5,15 z" fill="#8B4513"/>
        <path d="M-40,-20 a 40 15 0 0 0 80 0" fill="none" stroke="#6B3E26" stroke-width="5"/>
      </g>
      <!-- Magnifying Glass Lens (rendered on top) -->
      <circle cx="100" cy="175" r="28" fill="#5A6C7D" opacity="0.3" stroke="none"/>
    </g>
  </g>
</svg>
