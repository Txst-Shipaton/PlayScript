<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg-gradient-S36">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </radialGradient>
    <filter id="shadow-S36" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <pattern id="fog-pattern" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
        <circle cx="50" cy="150" r="80" fill="#C0D0E0" fill-opacity="0.08" />
        <circle cx="250" cy="50" r="100" fill="#C0D0E0" fill-opacity="0.06" />
        <circle cx="150" cy="300" r="120" fill="#C0D0E0" fill-opacity="0.07" />
        <circle cx="350" cy="250" r="90" fill="#C0D0E0" fill-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .stroked {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      fill-rule: evenodd;
    }

    @keyframes sherlock_look_up_tower_bridge_anim {
      0% { transform: rotateX(0deg); }
      50%, 100% { transform: rotateX(-30deg); }
    }

    @keyframes fog_drift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
    }

    #sherlock_head {
      transform-origin: 50% 90%;
      animation: sherlock_look_up_tower_bridge_anim 1s infinite linear;
    }

    .fog-layer {
        animation: fog_drift 25s infinite linear;
    }
  </style>

  <rect width="1280" height="720" fill="url(#bg-gradient-S36)" />

  <g id="bg_tower_bridge_structure">
    <path d="M0 450 L50 430 L100 440 L180 400 L250 420 L300 380 L400 410 L500 390 L600 420 L700 380 L800 430 L900 400 L1000 420 L1100 390 L1200 410 L1280 380 V 720 H 0 Z" fill="#2A3A4B" />
    <g fill="#5C6C7D" class="stroked">
        <path d="M0 550 H 1280 V 580 H 0 Z" />
        <path d="M400 300 L 400 550 L 420 550 L 420 350 L 480 350 L 480 550 L 500 550 L 500 300 L 470 280 L 430 280 Z" />
        <path d="M420 350 C 430 320, 470 320, 480 350" fill="none" />
        <path d="M780 300 L 780 550 L 800 550 L 800 350 L 860 350 L 860 550 L 880 550 L 880 300 L 850 280 L 810 280 Z" />
        <path d="M800 350 C 810 320, 850 320, 860 350" fill="none" />
        <path d="M500 310 H 780 V 325 H 500 Z" />
    </g>
  </g>

  <rect class="fog-layer" width="1680" height="720" fill="url(#fog-pattern)" />

  <g id="character_sherlock_holmes_looking_up" transform="translate(640, 320) scale(1.5)" filter="url(#shadow-S36)">
    <g id="sherlock_holmes_rig" style="transform-style: preserve-3d; perspective: 1000px;">
        <g id="torso">
            <path d="M -40 0 L 40 0 L 35 150 L -35 150 Z" fill="#8B4513" class="stroked" />
            <path d="M -25 10 L 25 10 L 25 140 L -25 140 Z" fill="#6B3E26" />
            <path d="M -15 15 L 15 15 L 15 130 L -15 130 Z" fill="#3B5B52" />
            <path d="M -5 20 L 5 20 L 5 40 L -5 40 Z" fill="#FFFFFF" />
        </g>
        <g id="sherlock_head">
            <path d="M 0 -70 C 25 -70, 25 -30, 0 0 C -25 -30, -25 -70, 0 -70 Z" fill="#E0B996" class="stroked" />
            <path d="M -20 -65 Q 0 -85 20 -65 L 15 -75 Q 0 -95 -15 -75 Z" fill="#4A2E1D" class="stroked" />
            <path d="M -5 -45 L 5 -45" stroke="#4A2E1D" stroke-width="2" />
        </g>
    </g>
  </g>
</svg>
