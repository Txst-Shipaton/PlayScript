<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bgGradientS5" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D4A76B"/>
      <stop offset="100%" stop-color="#8B2C3E"/>
    </radialGradient>
    <filter id="shadow_watson_body" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-5" dy="8" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow_holmes_body" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-3" dy="6" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes cameraPanS5 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-50px, -20px) scale(1.1); }
    }
    @keyframes watsonEntrance {
      0% { transform: translateX(50px); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateX(0px); opacity: 1; }
    }
    @keyframes sherlockGesture {
      0% { transform: rotateY(15deg); }
      50% { transform: rotateY(-5deg) translateY(-10px); }
      100% { transform: rotateY(-5deg); }
    }

    #camera {
      animation: cameraPanS5 2s linear infinite;
    }
    #character_watson_entering {
      animation: watsonEntrance 2s linear infinite;
      transform-origin: 50% 95%;
    }
    #character_sherlock_holmes_back {
      animation: sherlockGesture 2s linear infinite;
      transform-origin: 50% 95%;
    }
  </style>

  <rect width="1280" height="720" fill="url(#bgGradientS5)"/>

  <g id="camera">
    <!-- bg_red_patterned_wallpaper -->
    <rect x="0" y="0" width="1280" height="720" fill="#6B423A" />
    <g opacity="0.1">
      <line x1="0" y1="100" x2="1280" y2="100" stroke="#000" stroke-width="150"/>
      <line x1="0" y1="400" x2="1280" y2="400" stroke="#000" stroke-width="150"/>
      <line x1="0" y1="700" x2="1280" y2="700" stroke="#000" stroke-width="150"/>
    </g>
    
    <!-- bg_framed_pictures -->
    <g fill="#8C6B5A" stroke="#202020" stroke-width="1.8">
      <rect x="150" y="180" width="80" height="100"/>
      <rect x="250" y="200" width="60" height="60"/>
    </g>

    <!-- bg_rifle_on_wall -->
    <path d="M 400 250 L 550 260 L 540 270 L 410 260 Z" fill="#4A3A2E" stroke="#202020" stroke-width="1.8"/>

    <!-- bg_desk_with_items -->
    <g>
      <rect x="50" y="550" width="350" height="170" fill="#5C3A2E" stroke="#202020" stroke-width="1.8"/>
      <path d="M 100 550 C 100 520, 150 520, 150 550" fill="#8C6B5A" stroke="#202020" stroke-width="1.8"/>
      <rect x="200" y="530" width="80" height="20" fill="#E0D0B0" stroke="#202020" stroke-width="1.8"/>
    </g>

    <!-- bg_open_door_with_light -->
    <g>
      <rect x="1000" y="0" width="280" height="720" fill="#3A4A5B"/>
      <rect x="1010" y="0" width="270" height="720" fill="#D4A76B" opacity="0.2"/>
    </g>

    <!-- character_sherlock_holmes_back -->
    <g id="character_sherlock_holmes_back" transform="translate(700, 300)" filter="url(#shadow_holmes_body)">
      <path d="M -50 250 L -60 0 L 60 0 L 50 250 Z" fill="#8B4513" />
      <path d="M -55 250 L -65 -10 L -30 -10 L -25 250 Z M 25 250 L 30 -10 L 65 -10 L 55 250 Z" fill="#6B3E26"/>
      <path d="M -30 -10 L 30 -10 L 30 -40 L 0 -60 L -30 -40 Z" fill="#4A2E1D" />
      <rect x="-60" y="250" width="120" height="30" fill="#C0C0C0"/>
    </g>

    <!-- character_watson_entering -->
    <g id="character_watson_entering" transform="translate(1100, 320)" filter="url(#shadow_watson_body)">
      <path d="M -60 250 L -70 20 L 70 20 L 60 250 Z" fill="#8B4513"/>
      <rect x="-70" y="250" width="140" height="30" fill="#4A2E1D"/>
      <path d="M -40 20 L 40 20 L 40 0 L -40 0 Z" fill="#FFFFFF"/>
      <path d="M -50 -30 C -50 -70, 50 -70, 50 -30 L 50 -20 L -50 -20 Z" fill="#1A1A1A"/>
      <rect x="-55" y="-35" width="110" height="10" fill="#4A2E1D"/>
      <path d="M -25 -30 L 25 -30 L 20 -50 L -20 -50 Z" fill="#E0B996"/>
      <path d="M -15 -35 L 15 -35 L 15 -40 L -15 -40 Z" fill="#4A2E1D"/>
    </g>

  </g>
</svg>
