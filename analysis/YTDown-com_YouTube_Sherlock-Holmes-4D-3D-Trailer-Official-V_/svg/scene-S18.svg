<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradientS18" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5A6C7D"/>
      <stop offset="100%" stop-color="#2C3E4C"/>
    </linearGradient>
    <filter id="watsonShadow">
      <feDropShadow dx="-15" dy="0" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>
    .stroke-default {
      stroke: #202020;
      stroke-width: 1.8px;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }
    #camera_group {
      animation: cameraDollyS18 1s linear infinite;
      transform-origin: 50% 50%;
    }
    #dr_watson {
      animation: watsonRunS18 1s linear infinite;
      transform-origin: 50% 95%;
    }
    @keyframes cameraDollyS18 {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    @keyframes watsonRunS18 {
      0% { transform: translateX(100px) scale(0.8); }
      100% { transform: translateX(0px) scale(1); }
    }
  </style>

  <g id="camera_group">
    <!-- Background: bg_long_dark_hallway_with_archways_and_figures -->
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradientS18)"/>
    <g id="bg_hallway">
      <!-- Floor -->
      <path fill="#3A4A5B" d="M0 720 L540 450 H740 L1280 720 H0 Z"/>
      <!-- Arches -->
      <g fill="#5C3A2E" class="stroke-default">
        <!-- Left Arches -->
        <path d="M540 450 V200 C400 200 350 450 350 450 Z"/>
        <path d="M350 450 V280 C280 280 250 450 250 450 Z" transform="scale(0.9) translate(50, 50)"/>
        <path d="M250 450 V330 C200 330 180 450 180 450 Z" transform="scale(0.8) translate(100, 100)"/>
        <!-- Right Arches -->
        <path d="M740 450 V200 C880 200 930 450 930 450 Z"/>
        <path d="M930 450 V280 C1000 280 1030 450 1030 450 Z" transform="scale(0.9) translate(-50, 50)"/>
        <path d="M1030 450 V330 C1080 330 1100 450 1100 450 Z" transform="scale(0.8) translate(-100, 100)"/>
      </g>
      <!-- Wall Decor -->
      <g fill="#8C6B5A">
        <rect x="200" y="320" width="30" height="45"/>
        <rect x="1020" y="320" width="30" height="45"/>
      </g>
      <g fill="#C8A850">
        <circle cx="280" cy="380" r="8"/>
        <circle cx="990" cy="380" r="8"/>
      </g>
    </g>

    <!-- Character: character_watson_running -->
    <g id="dr_watson" filter="url(#watsonShadow)" transform="translate(580 250)">
      <g class="stroke-default">
        <!-- Trousers (Legs) -->
        <path fill="#4A2E1D" d="M45 190 L35 280 L60 280 L55 190 Z"/> <!-- Back Leg -->
        <path fill="#4A2E1D" d="M55 190 L85 240 L110 230 L65 190 Z"/> <!-- Front Leg -->
        
        <!-- Torso -->
        <path fill="#8B4513" d="M20 100 L90 100 L100 200 L10 200 Z"/>
        <path fill="#3B5B52" d="M35 105 L75 105 L70 140 L40 140 Z"/>
        <path fill="#FFFFFF" d="M45 105 L65 105 L60 115 L50 115 Z"/>
        <path fill="#1A1A1A" d="M52 112 L58 112 L60 120 L50 120 Z"/>

        <!-- Arms -->
        <path fill="#8B4513" d="M90 105 L120 130 L110 145 L85 115 Z"/> <!-- Right Arm -->
        <path fill="#E0B996" d="M118 128 L128 138 L118 148 L110 140 Z"/> <!-- Right Hand -->
        <path fill="#8B4513" d="M20 105 L-10 130 L0 145 L25 115 Z"/> <!-- Left Arm -->
        <path fill="#E0B996" d="M-8 128 L-18 138 L-8 148 L0 140 Z"/> <!-- Left Hand -->

        <!-- Head -->
        <g transform="translate(55 65)">
          <path fill="#E0B996" d="M0 0 A 35 40 0 1 1 0 1 Z" transform="translate(-35 -40)"/>
          <path fill="#4A2E1D" d="M-15 0 C -10 -5, 10 -5, 15 0 L 10 5 L -10 5 Z"/> <!-- Moustache -->
          <path fill="#1A1A1A" d="M0 -45 A 30 15 0 0 0 0 -15 A 30 15 0 0 0 0 -45 M-32 -25 H32"/> <!-- Bowler Hat -->
        </g>
      </g>
    </g>
  </g>
</svg>
