<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-grad-S31" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2C3E4C"/>
      <stop offset="100%" stop-color="#5A6C7D"/>
    </linearGradient>
    <filter id="shadow-holmes-S31">
      <feDropShadow dx="3" dy="5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-gate-S31">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .scene-S31 path, .scene-S31 rect, .scene-S31 circle {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }

    #character_sherlock_holmes_at_gate {
      animation: sherlockGateStruggle 1s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes sherlockGateStruggle {
      0% { transform: rotateY(0deg) translateX(0px); }
      50% { transform: rotateY(-10deg) translateX(-5px); }
      100% { transform: rotateY(0deg) translateX(0px); }
    }
  </style>

  <g id="scene-S31" class="scene-S31">
    <!-- Background -->
    <rect x="0" y="0" width="1280" height="720" fill="url(#bg-grad-S31)" stroke="none"/>

    <!-- Layer 1: bg_tower_of_london_wall (Stone Wall Sides) -->
    <g id="bg_tower_of_london_wall">
      <rect x="0" y="0" width="440" height="720" fill="#4A5A6B" stroke="none"/>
      <rect x="840" y="0" width="440" height="720" fill="#4A5A6B" stroke="none"/>
      <!-- Wall texture -->
      <path d="M 50 0 V 720 M 150 0 V 720 M 250 0 V 720 M 350 0 V 720
               M 0 100 H 440 M 0 250 H 440 M 0 400 H 440 M 0 550 H 440
               M 890 0 V 720 M 990 0 V 720 M 1090 0 V 720 M 1190 0 V 720
               M 840 80 H 1280 M 840 220 H 1280 M 840 380 H 1280 M 840 520 H 1280 M 840 680 H 1280"
            stroke="#3A4A5B" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Layer 2: large_metal_gate -->
    <g id="large_metal_gate" filter="url(#shadow-gate-S31)">
      <rect x="440" y="0" width="400" height="720" fill="#2A3A4B" stroke-width="2" stroke="#1A1A1A"/>
      <!-- Vertical Bars -->
      <path d="M 480 0 V 720 M 520 0 V 720 M 560 0 V 720 M 600 0 V 720 M 640 0 V 720 M 680 0 V 720 M 720 0 V 720 M 760 0 V 720 M 800 0 V 720" stroke="#3A4A5B" stroke-width="8"/>
      <!-- Horizontal supports and rivets -->
      <rect x="440" y="80" width="400" height="20" fill="#202020"/>
      <rect x="440" y="620" width="400" height="20" fill="#202020"/>
      <circle cx="460" cy="90" r="4" fill="#4A5A6B"/> <circle cx="500" cy="90" r="4" fill="#4A5A6B"/> <circle cx="540" cy="90" r="4" fill="#4A5A6B"/> <circle cx="580" cy="90" r="4" fill="#4A5A6B"/> <circle cx="620" cy="90" r="4" fill="#4A5A6B"/> <circle cx="660" cy="90" r="4" fill="#4A5A6B"/> <circle cx="700" cy="90" r="4" fill="#4A5A6B"/> <circle cx="740" cy="90" r="4" fill="#4A5A6B"/> <circle cx="780" cy="90" r="4" fill="#4A5A6B"/> <circle cx="820" cy="90" r="4" fill="#4A5A6B"/>
      <circle cx="460" cy="630" r="4" fill="#4A5A6B"/> <circle cx="500" cy="630" r="4" fill="#4A5A6B"/> <circle cx="540" cy="630" r="4" fill="#4A5A6B"/> <circle cx="580" cy="630" r="4" fill="#4A5A6B"/> <circle cx="620" cy="630" r="4" fill="#4A5A6B"/> <circle cx="660" cy="630" r="4" fill="#4A5A6B"/> <circle cx="700" cy="630" r="4" fill="#4A5A6B"/> <circle cx="740" cy="630" r="4" fill="#4A5A6B"/> <circle cx="780" cy="630" r="4" fill="#4A5A6B"/> <circle cx="820" cy="630" r="4" fill="#4A5A6B"/>
    </g>

    <!-- Layer 3: character_sherlock_holmes_at_gate -->
    <g id="character_sherlock_holmes_at_gate" filter="url(#shadow-holmes-S31)" transform="translate(640, 360) scale(1.2)">
      <g id="sherlock_rig">
        <!-- Legs -->
        <g id="legs">
          <path d="M -15 80 L -25 180 L -15 180 L -5 80 Z" fill="#C0C0C0"/>
          <path d="M 15 80 L 5 180 L 15 180 L 25 80 Z" fill="#C0C0C0"/>
          <path d="M -30 180 a 15 5 0 0 1 30 0 Z" fill="#4A2E1D"/>
          <path d="M 0 180 a 15 5 0 0 1 30 0 Z" fill="#4A2E1D"/>
        </g>
        <!-- Torso -->
        <g id="torso">
          <path d="M -30 -50 C -30 -50, -30 80, -30 80 L 30 80 C 30 80, 30 -50, 30 -50 Z" fill="#8B4513"/>
          <path d="M -20 80 V -40 L 20 -40 V 80 Z" fill="#3B5B52"/>
          <path d="M -10 -40 V -20 L 10 -20 V -40 Z" fill="#FFFFFF"/>
          <path d="M 0 -25 l -5 -5 l 10 0 z" fill="#1A1A1A"/>
        </g>
        <!-- Arms -->
        <g id="arms">
          <!-- Left Arm (pushing gate) -->
          <path d="M -30 -40 L -40 -10 L -80 30 L -70 40 L -30 -30 Z" fill="#8B4513"/>
          <path d="M -80 30 a 10 10 0 1 1 0.1 0 Z" fill="#E0B996"/>
          <!-- Right Arm (pushing gate) -->
          <path d="M 30 -40 L 40 -10 L 80 30 L 70 40 L 30 -30 Z" fill="#8B4513"/>
          <path d="M 80 30 a 10 10 0 1 1 0.1 0 Z" fill="#E0B996"/>
        </g>
        <!-- Head -->
        <g id="head" transform="translate(0, -75)">
          <path d="M 0 -30 C -25 -30, -25 15, 0 15 C 25 15, 25 -30, 0 -30 Z" fill="#E0B996"/>
          <path d="M -15 -25 C -10 -35, 10 -35, 15 -25 C 10 -20, -10 -20, -15 -25 Z" fill="#4A2E1D"/>
          <!-- Deerstalker Hat -->
          <g id="deerstalker_hat">
            <path d="M 0 -45 a 25 15 0 0 1 0 30 a 25 15 0 0 1 0 -30" fill="#8B4513"/>
            <path d="M -25 -30 h -10 l 5 -10 z" fill="#8B4513"/>
            <path d="M 25 -30 h 10 l -5 -10 z" fill="#8B4513"/>
            <path d="M -20 -35 h 10 v 10 h -10 z M 0 -35 h 10 v 10 h -10 z M -10 -25 h 10 v 10 h -10 z M 10 -25 h 10 v 10 h -10 z" fill="#6B3E26"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
