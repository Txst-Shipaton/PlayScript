<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg_gradient_S17" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2C3E4C" />
      <stop offset="100%" stop-color="#8B2C3E" />
    </linearGradient>
    <filter id="shadow_holmes" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <style>
    @keyframes scene_fade_S17 {
      0%, 80% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes violin_play_S17 {
      0% { transform: rotate(-1deg) translateX(-5px); }
      100% { transform: rotate(1deg) translateX(5px); }
    }
    #scene_S17 {
      animation: scene_fade_S17 1s infinite;
    }
    #character_sherlock_holmes_playing_violin {
      animation: violin_play_S17 1s ease-in-out infinite alternate;
      transform-origin: 50% 90%;
    }
    .stroke {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }
  </style>
  <g id="scene_S17">
    <rect fill="url(#bg_gradient_S17)" width="1280" height="720" />
    
    <g id="bg_red_patterned_wallpaper" opacity="0.05" class="stroke" stroke="#6B423A" stroke-width="80">
      <line x1="150" y1="0" x2="150" y2="720" />
      <line x1="450" y1="0" x2="450" y2="720" />
      <line x1="750" y1="0" x2="750" y2="720" />
      <line x1="1050" y1="0" x2="1050" y2="720" />
    </g>
    
    <g id="bg_bookshelf" class="stroke">
      <rect x="980" y="0" width="300" height="720" fill="#5C3A2E" />
      <path d="M 980 120 H 1280 M 980 240 H 1280 M 980 360 H 1280 M 980 480 H 1280 M 980 600 H 1280" stroke-opacity="0.5" stroke-width="4" />
    </g>
    
    <g id="bg_bust" transform="translate(150 480)" class="stroke" fill="#DCDCDC">
      <path d="M 0,100 H 100 V 80 Q 50,70 0,80 Z" />
      <path d="M 50,80 C 20,80 20,40 50,40 C 80,40 80,80 50,80" />
      <path d="M 50,40 C 50,0 20,-20 50,-70 C 80,-20 50,0 50,40" />
    </g>
    
    <g id="character_sherlock_holmes_playing_violin" filter="url(#shadow_holmes)">
      <g transform="translate(640 360)">
        <!-- Torso -->
        <path d="M -110,100 L -130,380 H 130 L 110,100 Z" fill="#8B4513" class="stroke" />
        <path d="M -70,100 V 280 L 0,260 L 70,280 V 100 Z" fill="#3B5B52" class="stroke" />
        <path d="M -25,100 L -25,150 L 25,150 L 25,100 Z" fill="#FFFFFF" class="stroke" />
        
        <!-- Head -->
        <g transform="translate(0, 20)">
          <path d="M 0,0 C -50,0 -60,50 -60,100 C -60,150 -50,200 0,200 C 50,200 60,150 60,100 C 60,50 50,0 0,0 Z" transform="translate(0 -100)" fill="#E0B996" class="stroke" />
          <path d="M 0,-100 Q -60,-110 -40,-130 C -10,-140 40,-140 60,-120 Q 65,-105 0,-100 Z" fill="#4A2E1D" class="stroke" />
        </g>
        
        <!-- Arms and Violin -->
        <g class="stroke">
          <!-- Violin -->
          <g transform="translate(-100, 220) rotate(-15)">
            <path d="M 0,0 C 20,-80 80,-100 100,-50 C 120,0 80,80 40,100 L 20,100 C -20,80 -20,20 0,0 Z" fill="#8B4513" />
            <path d="M 45,80 V -80" stroke-width="2" />
          </g>
          <!-- Bow -->
          <path d="M 180,150 L -80,280" stroke="#4A2E1D" stroke-width="6" stroke-linecap="round" />
          <!-- Arms -->
          <path d="M -110,120 C -160,150 -190,220 -170,250" fill="none" stroke="#8B4513" stroke-width="50" stroke-linecap="round" />
          <path d="M 110,120 C 160,150 190,220 170,250" fill="none" stroke="#8B4513" stroke-width="50" stroke-linecap="round" />
        </g>
      </g>
    </g>
  </g>
</svg>
