<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <style>
    @keyframes idle_body {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    @keyframes idle_head {
      0% { transform: rotateY(-5deg) rotateZ(-1deg); }
      50% { transform: rotateY(5deg) rotateZ(1deg); }
      100% { transform: rotateY(-5deg) rotateZ(-1deg); }
    }
    #sherlock_holmes {
      animation: idle_body 6s ease-in-out infinite;
    }
    #head {
      animation: idle_head 8s ease-in-out infinite;
    }
  </style>
  <defs>
    <pattern id="plaidPattern" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#8B4513"/>
      <path d="M 0 2 L 12 2 M 0 8 L 12 8 M 2 0 L 2 12 M 8 0 L 8 12" stroke="#6B3E26" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#2C3E4C"/>

  <g id="sherlock_holmes" transform="translate(640, 100)" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Legs -->
    <g id="leg_right" transform-origin="50% 10%">
      <path d="M -25 290 L -5 390 L -30 500 L -60 490 Z" fill="#C0C0C0"/>
      <path d="M -65 490 Q -70 510 -40 515 L -20 505 L -30 495 Z" fill="#4A2E1D"/>
    </g>
    <g id="leg_left" transform-origin="50% 10%">
      <path d="M 25 290 L 5 390 L 30 500 L 60 490 Z" fill="#C0C0C0"/>
      <path d="M 65 490 Q 70 510 40 515 L 20 505 L 30 495 Z" fill="#4A2E1D"/>
    </g>

    <!-- Torso -->
    <g id="torso">
      <!-- Overcoat -->
      <path d="M -80 80 L -60 300 L 60 300 L 80 80 L 70 70 L 20 70 V 110 L 0 130 L -20 110 V 70 L -70 70 Z" fill="url(#plaidPattern)"/>
      <!-- Waistcoat & Shirt -->
      <path d="M -20 70 L 0 130 L 20 70 Z" fill="#3B5B52"/>
      <path d="M -15 75 L 0 100 L 15 75 L 0 70 Z" fill="#FFFFFF"/>
      <path d="M -5 95 L 0 105 L 5 95 Z" fill="#1A1A1A"/>
    </g>

    <!-- Arms -->
    <g id="arm_left" transform-origin="50% 10%">
      <path d="M -75 85 L -90 250 L -65 255 Z" fill="url(#plaidPattern)"/>
      <path d="M -70 250 L -80 260 L -70 270 L -60 260 Z" fill="#E0B996"/>
    </g>
    <g id="arm_right" transform-origin="50% 10%">
       <path d="M 75 85 L 90 250 L 65 255 Z" fill="url(#plaidPattern)"/>
       <!-- Hand and Pipe -->
       <g id="hand_right">
          <path d="M 70 250 L 80 260 L 70 270 L 60 260 Z" fill="#E0B996"/>
          <path d="M 75 265 C 85 260 95 270 90 280 L 85 295 C 80 290 75 290 75 285 Z" fill="#8B4513"/>
          <path d="M 84 296 L 80 305" fill="none" stroke="#1A1A1A" stroke-width="3"/>
       </g>
    </g>

    <!-- Head -->
    <g id="head" transform-origin="50% 90%">
      <!-- Deerstalker Hat -->
      <g id="deerstalker_hat">
        <path d="M -50 -10 C -50 -50 50 -50 50 -10 C 20 -20 -20 -20 -50 -10 Z" fill="url(#plaidPattern)"/>
        <path d="M -60 -5 L -50 -10 L -40 5 Z" fill="url(#plaidPattern)"/>
        <path d="M 60 -5 L 50 -10 L 40 5 Z" fill="url(#plaidPattern)"/>
      </g>
      <!-- Face -->
      <path d="M -40 0 C -50 80 50 80 40 0 Z" fill="#E0B996"/>
      <!-- Hair -->
      <path d="M -40 0 C -45 20 -20 25 0 20 C 20 25 45 20 40 0 L 35 -10 C 20 -5 -20 -5 -35 -10 Z" fill="#4A2E1D"/>
      <!-- Features -->
      <path d="M -20 35 C -15 32 -10 35 -15 35" fill="none" stroke-linecap="round"/> <!-- Eye Left -->
      <path d="M 20 35 C 15 32 10 35 15 35" fill="none" stroke-linecap="round"/> <!-- Eye Right -->
      <path d="M 0 40 L 2 55 L -2 55 Z" fill="currentColor"/> <!-- Nose -->
    </g>
  </g>
</svg>
