      <stop offset="0%" stop-color="#8B2C3E"/>
      <stop offset="100%" stop-color="#5A202F"/>
    </linearGradient>
    <pattern id="wallpaperPattern" patternUnits="userSpaceOnUse" width="100" height="100" x="0" y="0">
      <path d="M 50,0 L 60,10 L 50,20 L 40,10 Z M 0,50 L 10,60 L 20,50 L 10,40 Z M 50,100 L 60,90 L 50,80 L 40,90 Z M 100,50 L 90,60 L 80,50 L 90,40 Z" fill="#6B423A" opacity="0.1"/>
