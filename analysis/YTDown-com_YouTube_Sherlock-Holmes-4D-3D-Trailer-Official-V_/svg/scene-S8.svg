        d: path('M675,352 C695,325 725,325 745,352 C725,380 695,380 675,352Z');
        transform: scale(1.02);
      }
    }
    .eye-anim {
      animation-duration: 1s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
  </style>
  <rect width="1280" height="720" fill="url(#bgGradientS8)"/>
