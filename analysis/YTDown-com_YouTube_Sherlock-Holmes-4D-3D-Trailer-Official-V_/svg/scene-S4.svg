<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradientS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3E4C"/>
      <stop offset="100%" stop-color="#5A4B3C"/>
    </linearGradient>
    <filter id="shadow_holmes" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .stroke { stroke: #202020; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    @keyframes sherlock_head_turn {
      0% { transform: rotateY(0deg); }
      50%, 100% { transform: rotateY(15deg); }
    }

    #head {
      animation: sherlock_head_turn 2s infinite linear;
    }
  </style>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradientS4)"/>

  <g id="environment_S4">
    <!-- bg_window_dark_blue_curtain -->
    <g id="bg_window_dark_blue_curtain">
      <rect x="50" y="100" width="250" height="450" fill="#1A2B3D"/>
      <path d="M 50 100 L 50 550 L 175 550 Q 150 325 175 100 L 50 100 Z" fill="#4A5A6B" class="stroke"/>
      <line x1="175" y1="100" x2="175" y2="550" class="stroke" stroke-width="4"/>
      <line x1="50" y1="325" x2="300" y2="325" class="stroke" stroke-width="4"/>
    </g>

    <!-- bg_bookshelf -->
    <g id="bg_bookshelf">
      <rect x="850" y="50" width="380" height="620" fill="#5C3A2E" class="stroke"/>
      <path d="M860 150 h 360 M860 250 h 360 M860 350 h 360 M860 450 h 360 M860 550 h 360 M860 650 h 360" stroke="#4A3A2E" stroke-width="10"/>
    </g>

    <!-- music_stand_with_sheet_music -->
    <g id="music_stand_with_sheet_music" transform="translate(700, 350)">
      <path d="M 0 300 L 0 50 M -50 50 L 50 50 M 0 50 Q -80 -30, -120 -40 L -120 60 L 120 60 L 120 -40 Q 80 -30, 0 50" fill="#4A2E1D" class="stroke"/>
      <rect x="-100" y="-30" width="200" height="80" fill="#FFFFFF" class="stroke"/>
    </g>
  </g>

  <!-- character_sherlock_holmes -->
  <g id="character_sherlock_holmes" transform="translate(640, 320)" filter="url(#shadow_holmes)">
    <g id="torso">
      <!-- Trousers (visible part) -->
      <path d="M -60 200 C -60 250, -20 280, 0 280 S 60 250, 60 200 L -60 200 Z" fill="#C0C0C0" class="stroke"/>
      <!-- Torso/Waistcoat -->
      <path d="M -60 200 L -70 50 Q 0 30, 70 50 L 60 200 L 20 200 L 20 70 L -20 70 L -20 200 Z" fill="#3B5B52" class="stroke"/>
      <!-- Shirt -->
      <path d="M -20 70 L 20 70 L 0 45 Z" fill="#FFFFFF" class="stroke"/>
      <!-- Cravat -->
      <path d="M -5 55 L 5 55 L 0 75 Z" fill="#1A1A1A" class="stroke"/>
    </g>
    <g id="arm_right" transform="translate(70, 70)">
      <path d="M 0 0 Q 10 50, 0 100 L -20 100 Q -30 50, -20 0 Z" fill="#3B5B52" class="stroke"/>
      <circle cx="0" cy="100" r="15" fill="#E0B996" class="stroke"/>
    </g>
    <g id="arm_left" transform="translate(-70, 70)">
      <path d="M 0 0 Q -10 50, 0 100 L 20 100 Q 30 50, 20 0 Z" fill="#3B5B52" class="stroke"/>
      <circle cx="0" cy="100" r="15" fill="#E0B996" class="stroke"/>
    </g>
    <g id="head" transform-origin="0px 45px">
      <!-- Neck -->
      <rect x="-15" y="30" width="30" height="20" fill="#E0B996" class="stroke"/>
      <!-- Head -->
      <path d="M 0 -70 C 40 -70, 50 -40, 50 0 C 50 40, 30 50, 0 50 C -30 50, -50 40, -50 0 C -50 -40, -40 -70, 0 -70 Z" fill="#E0B996" class="stroke"/>
      <!-- Hair -->
      <path d="M 0 -70 C 40 -70, 50 -40, 45 -20 C 40 -50, 20 -65, 0 -65 S -40 -50, -45 -20 C -50 -40, -40 -70, 0 -70 Z" fill="#4A2E1D" class="stroke"/>
      <path d="M -45 -20 C -55 0, -40 10, -30 5 M 45 -20 C 55 0, 40 10, 30 5" fill="none" class="stroke"/>
      <!-- Eyes -->
      <circle cx="-20" cy="-15" r="3" fill="#5F8B5A"/>
      <circle cx="20" cy="-15" r="3" fill="#5F8B5A"/>
      <!-- Nose -->
      <path d="M 0 -15 L -5 5 L 5 5 Z" class="stroke" fill="#E0B996"/>
    </g>
  </g>
</svg>
