<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg_grad_S15" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D4A76B"/>
      <stop offset="100%" stop-color="#1A2B3D"/>
    </radialGradient>
    <filter id="shadow_police" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="10" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow_barrier" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="7" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .scene-background { fill: url(#bg_grad_S15); }
    .stroke { stroke: #202020; stroke-width: 1.8; stroke-linecap: butt; stroke-linejoin: miter; }
    .facade { fill: #4A5A6B; }
    .arches { fill: #2A3A4B; }
    .police-uniform, .police-helmet { fill: #1A1A1A; }
    .police-badge { fill: #C0C0C0; }
    .police-gloves { fill: #FFFFFF; }
    .police-skin { fill: #E0B996; }
    .lamppost { fill: #8C8C8C; }
    .bench { fill: #5C3A2E; }
    .barriers { fill: #8C8C8C; }
    .fog { fill: #C0D0E0; opacity: 0.2; }

    #camera_S15 {
      animation: camera_pan_S15 1s ease-in-out infinite;
    }
    #police_officers {
      animation: police_fade_in_S15 1s linear infinite;
    }

    @keyframes camera_pan_S15 {
      0% { transform: translateY(0px) translateZ(0px); }
      50%, 100% { transform: translateY(50px) translateZ(-20px); }
    }
    @keyframes police_fade_in_S15 {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>

  <rect class="scene-background" width="1280" height="720"/>

  <g id="camera_S15">
    <!-- Layer: bg_bank_of_england_building_facade -->
    <g id="bg_bank_of_england_building_facade" class="facade stroke">
      <path d="M-50,0 H1330 V720 H-50 Z" opacity="0.6"/>
      <path d="M200,100 h880 v500 h-880 z" opacity="0.8"/>
      <rect x="150" y="100" width="50" height="500"/>
      <rect x="1080" y="100" width="50" height="500"/>
    </g>

    <!-- Layer: bg_archways -->
    <g id="bg_archways" class="arches stroke">
      <path d="M540,600 v-200 a100,100 0 0 1 200,0 v200 z"/>
    </g>
    
    <path class="fog" d="M0 450 C 200 400, 400 500, 640 450 S 880 400, 1080 450 S 1280 400, 1280 450 V 720 H 0 Z"/>

    <!-- Layer: police_officers -->
    <g id="police_officers" filter="url(#shadow_police)">
      <g id="police_officer_1" transform="translate(600, 380) scale(1.2)">
        <path class="police-helmet stroke" d="M-40,20 C-40,-10 40,-10 40,20 A40,40 0 0 1 -40,20 Z"/>
        <circle class="police-badge" cx="0" cy="-5" r="5"/>
        <path class="police-skin stroke" d="M-25,18 h50 v20 h-50 z"/>
        <path class="police-uniform stroke" d="M-50,38 h100 v100 h-100 z"/>
        <path class="police-gloves stroke" d="M-60,100 h20 v25 h-20 z M40,100 h20 v25 h-20 z"/>
      </g>
    </g>

    <!-- Layer: lamppost -->
    <g id="lamppost" class="lamppost stroke" transform="translate(250, 250)">
       <rect x="-10" y="0" width="20" height="470"/>
       <path d="M-30,0 h60 v-30 a30,30 0 0 0 -60,0 z"/>
    </g>

    <!-- Layer: bench -->
    <g id="bench" class="bench stroke" transform="translate(950, 550)">
      <rect x="0" y="0" width="250" height="20"/>
      <rect x="10" y="20" width="20" height="80"/>
      <rect x="220" y="20" width="20" height="80"/>
    </g>

    <!-- Layer: barriers -->
    <g id="barriers" class="barriers stroke" filter="url(#shadow_barrier)" transform="translate(0, 650)">
      <path d="M350,0 L450,70 M450,0 L350,70"/>
      <path d="M450,0 L550,70 M550,0 L450,70"/>
      <path d="M730,0 L830,70 M830,0 L730,70"/>
      <path d="M830,0 L930,70 M930,0 L830,70"/>
      <rect x="330" y="-10" width="620" height="10"/>
      <rect x="330" y="70" width="620" height="10"/>
    </g>
  </g>
</svg>
