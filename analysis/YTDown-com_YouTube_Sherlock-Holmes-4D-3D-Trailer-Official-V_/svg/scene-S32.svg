<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="gradient-S32" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5A6C7D"/>
      <stop offset="100%" stop-color="#2A3B4C"/>
    </linearGradient>
    <filter id="shadow-holmes">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-gate">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .scene {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }
    #character_sherlock_holmes_at_gate {
      animation: sherlock_gate_struggle 1s ease-in-out infinite;
      transform-origin: 50% 80%;
    }
    .fog-layer {
      animation: fog-drift 30s linear infinite alternate;
    }
    @keyframes sherlock_gate_struggle {
      0% { transform: translateX(0) rotate(0); }
      50% { transform: translateX(-10px) rotate(-1.5deg); }
      100% { transform: translateX(0) rotate(0); }
    }
    @keyframes fog-drift {
      from { transform: translateX(-50px); }
      to { transform: translateX(50px); }
    }
  </style>
  <g id="S32" class="scene">
    <rect id="bg_tower_of_london_wall" width="1280" height="720" fill="url(#gradient-S32)"/>
    <g id="fog_effect" opacity="0.3" fill="#C0D0E0" stroke="none">
      <path class="fog-layer" d="M -100 650 C 150 620, 350 680, 640 650 C 930 620, 1130 680, 1380 650 L 1380 720 L -100 720 Z" style="animation-duration: 35s;"/>
      <path class="fog-layer" d="M -100 680 C 200 660, 450 700, 640 680 C 830 660, 1080 700, 1380 680 L 1380 720 L -100 720 Z" style="animation-duration: 25s;"/>
    </g>
    <g id="large_metal_gate" filter="url(#shadow-gate)" fill="#2A3A4B">
      <rect x="250" y="0" width="80" height="720"/>
      <rect x="450" y="0" width="80" height="720"/>
      <rect x="650" y="0" width="80" height="720"/>
      <rect x="850" y="0" width="80" height="720"/>
      <rect x="1050" y="0" width="80" height="720"/>
      <rect x="0" y="100" width="1280" height="20"/>
      <rect x="0" y="600" width="1280" height="20"/>
    </g>
    <g id="character_sherlock_holmes_at_gate" filter="url(#shadow-holmes)">
      <!-- Torso -->
      <path fill="#8B4513" d="M 600 400 L 580 650 L 700 650 L 680 400 Z"/>
      <!-- Trousers -->
      <path fill="#C0C0C0" d="M 580 650 L 570 720 L 640 720 L 630 650 Z"/>
      <path fill="#C0C0C0" d="M 640 650 L 630 720 L 710 720 L 700 650 Z"/>
      <!-- Head -->
      <g transform="translate(640, 350)">
        <circle cx="0" cy="0" r="50" fill="#E0B996"/>
        <path fill="#4A2E1D" d="M -45 -10 a 50 50 0 0 1 90 0 a 50 40 0 0 1 -90 0"/>
      </g>
      <!-- Arms pushing gate -->
      <g>
        <!-- Left arm -->
        <path fill="#8B4513" d="M 600 420 C 550 430, 500 480, 490 530 L 510 535 C 520 490, 560 445, 610 430 Z"/>
        <circle cx="490" cy="530" r="15" fill="#E0B996"/>
        <!-- Right arm -->
        <path fill="#8B4513" d="M 680 420 C 730 430, 780 480, 790 530 L 770 535 C 760 490, 720 445, 670 430 Z"/>
        <circle cx="790" cy="530" r="15" fill="#E0B996"/>
      </g>
    </g>
  </g>
</svg>
