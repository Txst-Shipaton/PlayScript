<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradientS12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3E4C" />
      <stop offset="100%" stop-color="#5A6C7D" />
    </linearGradient>
    <filter id="dropShadowS12">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <style>
    .stroke-global {
      stroke: #202020;
      stroke-width: 1.8;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      fill-rule: evenodd;
    }
    @keyframes cameraPanS12 {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-200px); }
    }
    @keyframes sherlockIdleS12 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(2px); }
      100% { transform: translateY(0px); }
    }
    #camera_S12 {
      animation: cameraPanS12 1s linear infinite;
    }
    #character_sherlock_holmes_S12 {
      animation: sherlockIdleS12 2s ease-in-out infinite;
    }
  </style>
  <g id="sceneS12">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradientS12)" />
    <g id="camera_S12">
      <g id="environmentS12">
        <rect x="0" y="0" width="1500" height="720" fill="#4A5A6B" />
        <g id="columns">
          <rect x="200" y="0" width="100" height="720" fill="#5C6C7D" class="stroke-global" />
          <rect x="210" y="0" width="10" height="720" fill="#4A5A6B" opacity="0.3" />
          <rect x="280" y="0" width="10" height="720" fill="#2C3E4C" opacity="0.3" />
          <rect x="700" y="0" width="100" height="720" fill="#5C6C7D" class="stroke-global" />
          <rect x="710" y="0" width="10" height="720" fill="#4A5A6B" opacity="0.3" />
          <rect x="780" y="0" width="10" height="720" fill="#2C3E4C" opacity="0.3" />
          <rect x="1200" y="0" width="100" height="720" fill="#5C6C7D" class="stroke-global" />
          <rect x="1210" y="0" width="10" height="720" fill="#4A5A6B" opacity="0.3" />
          <rect x="1280" y="0" width="10" height="720" fill="#2C3E4C" opacity="0.3" />
        </g>
        <g id="windows">
          <rect x="450" y="200" width="150" height="250" fill="#2A3A4B" class="stroke-global" />
          <rect x="950" y="200" width="150" height="250" fill="#2A3A4B" class="stroke-global" />
        </g>
      </g>
      <g id="character_sherlock_holmes_S12" transform="translate(640 380) scale(2.5)" filter="url(#dropShadowS12)" style="transform-origin: 50% 90%;">
        <g transform="translate(0, 30)">
            <path d="M -50,50 L -50,100 L 50,100 L 50,50 C 50,20 30,0 0,0 C -30,0 -50,20 -50,50 Z" fill="#8B4513" class="stroke-global" />
            <path d="M 0,0 C 10,5 15,20 15,30 L -15,30 C -15,20 -10,5 0,0 Z" fill="#FFFFFF" class="stroke-global" />
            <path d="M 0,25 L 5,35 L -5,35 Z" fill="#1A1A1A" class="stroke-global" />
            <g id="head" transform="translate(0, -50)">
                <path d="M 0,-40 C 25,-40 35,-20 35,0 C 35,25 20,40 0,40 C -20,40 -35,25 -35,0 C -35,-20 -25,-40 0,-40 Z" fill="#E0B996" class="stroke-global" />
                <path d="M 0,-40 C 25,-40 35,-20 35,0 C 35,-10 25,-35 0,-38 C -25,-35 -35,-10 -35,0 C -35,-20 -25,-40 0,-40 Z" fill="#4A2E1D" class="stroke-global" />
                <circle cx="15" cy="-5" r="3" fill="#5F8B5A" />
                <path d="M 10,-8 L 20,-8" stroke="#4A2E1D" stroke-width="2" fill="none" />
            </g>
            <g id="arm_right" transform="translate(40, 30)">
                <path d="M 0,0 L 20,5 L 25,25 L 5,20 Z" fill="#8B4513" class="stroke-global" />
                <path d="M 20,22 C 25,20 35,25 35,35 C 35,45 25,50 20,48 Z" fill="#E0B996" class="stroke-global" />
                <g id="magnifying_glass" transform="translate(30, 40)">
                    <circle cx="0" cy="0" r="20" fill="#C0D0E0" fill-opacity="0.3" stroke="#C0C0C0" stroke-width="3" />
                    <path d="M -22,0 L -35,-5 L -35,5 Z" fill="#8B4513" class="stroke-global" />
                </g>
            </g>
            <g id="arm_left" transform="translate(-45, 35)">
                <path d="M 0,0 L -20,5 L -25,25 L -5,20 Z" fill="#8B4513" class="stroke-global" />
                <path d="M -20,22 C -25,20 -35,25 -35,35 C -35,45 -25,50 -20,48 Z" fill="#E0B996" class="stroke-global" />
                <g id="pipe" transform="translate(-30, 30) rotate(-20)">
                    <path d="M 0,0 C 10,0 15,-5 15,-10 L 20,-10 C 20,0 10,10 0,10 Z" fill="#8B4513" class="stroke-global" />
                    <rect x="-15" y="-2" width="15" height="4" fill="#1A1A1A" class="stroke-global" />
                </g>
            </g>
        </g>
      </g>
    </g>
  </g>
</svg>
